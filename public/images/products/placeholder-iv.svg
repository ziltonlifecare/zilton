<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ivBag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#E8F4EE" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d4ebdf" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#087B59" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#087B59" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="ivShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173B30" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Platform Shadow -->
  <ellipse cx="160" cy="252" rx="75" ry="12" fill="#087B59" fill-opacity="0.1"/>

  <!-- IV Infusion Bottle Container -->
  <g transform="translate(110, 25)" filter="url(#ivShadow)">
    <!-- Hanging Eyelet / Loop -->
    <path d="M50 10 C42 10 38 16 38 24 L38 30 L62 30 L62 24 C62 16 58 10 50 10 Z" fill="#DCE8E0" stroke="#087B59" stroke-width="1.5"/>
    <circle cx="50" cy="20" r="4" fill="#ffffff" stroke="#087B59" stroke-width="1.5"/>

    <!-- Bottle Neck -->
    <rect x="42" y="30" width="16" height="12" fill="url(#ivBag)" stroke="#9bb7a8" stroke-width="1.5"/>
    <!-- Bottle Shoulder -->
    <path d="M42 42 C28 46 16 58 16 75 L16 195 C16 208 26 218 40 218 L60 218 C74 218 84 208 84 195 L84 75 C84 58 72 46 58 42 Z" fill="url(#ivBag)" stroke="#087B59" stroke-width="2"/>

    <!-- Fluid Content -->
    <path d="M18 105 L82 105 L82 195 C82 206 73 216 60 216 L40 216 C27 216 18 206 18 195 Z" fill="url(#fluidGrad)"/>
    <ellipse cx="50" cy="105" rx="32" ry="4" fill="#087B59" fill-opacity="0.25"/>

    <!-- Volumetric Calibration Graduation Markings -->
    <g stroke="#087B59" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <line x1="22" y1="120" x2="32" y2="120"/>
      <line x1="22" y1="135" x2="28" y2="135"/>
      <line x1="22" y1="150" x2="34" y2="150"/>
      <line x1="22" y1="165" x2="28" y2="165"/>
      <line x1="22" y1="180" x2="32" y2="180"/>
      <line x1="22" y1="195" x2="28" y2="195"/>
    </g>

    <!-- Pharmaceutical Clinical Label -->
    <rect x="36" y="115" width="44" height="68" rx="4" fill="#ffffff" fill-opacity="0.95" stroke="#DCE8E0" stroke-width="1"/>
    <rect x="40" y="120" width="36" height="3" rx="1" fill="#087B59"/>
    <line x1="40" y1="130" x2="68" y2="130" stroke="#173B30" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="138" x2="74" y2="138" stroke="#087B59" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="40" y1="146" x2="65" y2="146" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="40" y="153" width="30" height="7" rx="2" fill="#E8F4EE"/>
    <text x="55" y="158.5" font-family="sans-serif" font-size="5" font-weight="700" fill="#087B59" text-anchor="middle">500 mL IV</text>

    <!-- Glass Specular Gloss -->
    <line x1="20" y1="55" x2="20" y2="205" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Droplet & Infusion Badge -->
  <g transform="translate(205, 155)">
    <circle cx="22" cy="22" r="22" fill="#ffffff" stroke="#DCE8E0" stroke-width="2" filter="url(#ivShadow)"/>
    <circle cx="22" cy="22" r="18" fill="#E8F4EE"/>
    <!-- Liquid Drop -->
    <path d="M22 12 C22 12 15 21 15 25 C15 29 18 32 22 32 C26 32 29 29 29 25 C29 21 22 12 22 12 Z" fill="#087B59"/>
    <circle cx="20" cy="23" r="1.5" fill="#ffffff"/>
  </g>
</svg>
