<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vialGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#E8F4EE" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbe5d8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#087B59" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087B59"/>
      <stop offset="50%" stop-color="#0a996f"/>
      <stop offset="100%" stop-color="#066447"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#173B30" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Glow & Platform -->
  <ellipse cx="160" cy="245" rx="90" ry="14" fill="#087B59" fill-opacity="0.08"/>
  <ellipse cx="160" cy="244" rx="60" ry="8" fill="#087B59" fill-opacity="0.12"/>

  <!-- Left: Sterile Ampoule -->
  <g transform="translate(68, 65) rotate(-6)" filter="url(#softShadow)">
    <!-- Ampoule Tip -->
    <path d="M40 10 C40 10 43 15 43 25 C43 35 46 42 48 45 L48 50 L32 50 L32 45 C34 42 37 35 37 25 C37 15 40 10 40 10 Z" fill="#E8F4EE" stroke="#087B59" stroke-width="1.5"/>
    <!-- Ampoule Body -->
    <rect x="28" y="50" width="24" height="85" rx="6" fill="url(#vialGlass)" stroke="#087B59" stroke-width="1.5"/>
    <path d="M30 75 L50 75 L50 128 C50 131 48 133 45 133 L35 133 C32 133 30 131 30 128 Z" fill="url(#liquidGrad)"/>
    <line x1="33" y1="90" x2="40" y2="90" stroke="#087B59" stroke-width="1" stroke-linecap="round"/>
    <line x1="33" y1="100" x2="38" y2="100" stroke="#087B59" stroke-width="1" stroke-linecap="round"/>
    <line x1="33" y1="110" x2="42" y2="110" stroke="#087B59" stroke-width="1" stroke-linecap="round"/>
    <!-- Specular Highlight -->
    <line x1="32" y1="55" x2="32" y2="128" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Center: Sterile Injection Vial -->
  <g transform="translate(115, 45)" filter="url(#softShadow)">
    <!-- Flip-Off Crimp Cap -->
    <rect x="26" y="8" width="38" height="12" rx="3" fill="url(#capGrad)"/>
    <rect x="22" y="20" width="46" height="8" rx="2" fill="#DCE8E0" stroke="#9bb7a8" stroke-width="1"/>
    <!-- Vial Neck -->
    <rect x="30" y="28" width="30" height="14" fill="url(#vialGlass)" stroke="#9bb7a8" stroke-width="1.5"/>
    <!-- Vial Shoulder & Body -->
    <path d="M30 42 C20 45 10 55 10 70 L10 165 C10 176 19 185 30 185 L60 185 C71 185 80 176 80 165 L80 70 C80 55 70 45 60 42 Z" fill="url(#vialGlass)" stroke="#087B59" stroke-width="2"/>
    <!-- Liquid Contents -->
    <path d="M12 95 L78 95 L78 165 C78 174 71 182 62 182 L28 182 C19 182 12 174 12 165 Z" fill="url(#liquidGrad)"/>
    <!-- Liquid Surface Meniscus -->
    <ellipse cx="45" cy="95" rx="33" ry="4" fill="#087B59" fill-opacity="0.3"/>
    
    <!-- Pharmaceutical Label Band -->
    <rect x="11" y="98" width="68" height="52" fill="#ffffff" fill-opacity="0.95" stroke="#DCE8E0" stroke-width="1"/>
    <rect x="15" y="103" width="60" height="4" fill="#087B59" rx="1"/>
    <line x1="16" y1="114" x2="55" y2="114" stroke="#173B30" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="122" x2="65" y2="122" stroke="#087B59" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="16" y1="130" x2="48" y2="130" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="16" y="137" width="22" height="7" rx="2" fill="#E8F4EE"/>
    <text x="27" y="142.5" font-family="sans-serif" font-size="5" font-weight="700" fill="#087B59" text-anchor="middle">STERILE</text>

    <!-- Glass Reflection Highlights -->
    <line x1="15" y1="48" x2="15" y2="175" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="75" y1="52" x2="75" y2="175" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Sterile Badge Shield -->
  <g transform="translate(205, 170)">
    <circle cx="20" cy="20" r="22" fill="#ffffff" stroke="#DCE8E0" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="20" cy="20" r="18" fill="#E8F4EE"/>
    <path d="M20 10 L28 14 V20 C28 25 24 29 20 31 C16 29 12 25 12 20 V14 L20 10 Z" fill="#087B59"/>
    <path d="M16 20 L19 23 L24 17" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
