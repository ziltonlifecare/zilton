<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4F8F5"/>
      <stop offset="100%" stop-color="#E7EFEA"/>
    </radialGradient>
    <linearGradient id="vialGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#E8F4EE" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBE5D8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#165442" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A7D58" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="cartonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7FAF8"/>
      <stop offset="100%" stop-color="#EBF3EE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#123D32" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Studio Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Radial Floor Reflection & Shadow Platform -->
  <ellipse cx="200" cy="265" rx="130" ry="16" fill="#1B634E" fill-opacity="0.08"/>
  <ellipse cx="200" cy="264" rx="80" ry="9" fill="#1B634E" fill-opacity="0.12"/>

  <!-- ── 1. MONOCARTON PACKAGING (BACKGROUND) ── -->
  <g transform="translate(60, 48)" filter="url(#softShadow)">
    <!-- Main Carton Box -->
    <rect x="0" y="0" width="135" height="200" rx="6" fill="url(#cartonGrad)" stroke="#1B634E" stroke-opacity="0.18" stroke-width="1.5"/>
    <!-- Top Brand Header Band -->
    <rect x="0" y="0" width="135" height="42" rx="6" fill="#0A7D58"/>
    <rect x="0" y="36" width="135" height="6" fill="#165442"/>
    
    <!-- Rx Symbol -->
    <text x="14" y="24" font-family="serif" font-size="14" font-weight="bold" font-style="italic" fill="#FFFFFF">Rx</text>
    <text x="36" y="22" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="1" fill="#FFFFFF" opacity="0.9">ZILTON LIFE CARE</text>
    
    <!-- Carton Product Typography -->
    <text x="14" y="68" font-family="'Fraunces', serif" font-size="13" font-weight="bold" fill="#1B634E">MEROZIL 500mg</text>
    <text x="14" y="82" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#0A7D58">Meropenem Injection I.P.</text>
    <text x="14" y="94" font-family="'Inter', sans-serif" font-size="7" font-weight="500" fill="#6B9484">Carbapenem Antibiotic</text>
    
    <!-- Formulation Dosage Badge -->
    <rect x="14" y="106" width="70" height="16" rx="3" fill="#DCEEE4"/>
    <text x="49" y="117.5" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#1B634E" text-anchor="middle">500 mg</text>

    <!-- Storage / Hospital Use Specs -->
    <line x1="14" y1="134" x2="121" y2="134" stroke="#E2ECE6" stroke-width="1"/>
    <text x="14" y="146" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#3E6958">For Institutional / Hospital Supply</text>
    <text x="14" y="156" font-family="'Inter', sans-serif" font-size="6.5" font-weight="500" fill="#3E6958">Store per package insert</text>
    <text x="14" y="166" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#0A7D58">Sterile Lyophilized Preparation</text>

    <!-- Carton Bottom Barcode / Verification -->
    <g transform="translate(14, 178)" opacity="0.7">
      <rect x="0" y="0" width="2" height="12" fill="#1B634E"/>
      <rect x="4" y="0" width="1" height="12" fill="#1B634E"/>
      <rect x="7" y="0" width="3" height="12" fill="#1B634E"/>
      <rect x="12" y="0" width="1" height="12" fill="#1B634E"/>
      <rect x="15" y="0" width="2" height="12" fill="#1B634E"/>
      <rect x="19" y="0" width="3" height="12" fill="#1B634E"/>
      <rect x="24" y="0" width="1" height="12" fill="#1B634E"/>
      <rect x="27" y="0" width="2" height="12" fill="#1B634E"/>
      <text x="34" y="9" font-family="monospace" font-size="6" fill="#1B634E">ZLC-CALIBRATED</text>
    </g>
  </g>

  <!-- ── 2. FOREGROUND PRESENTATION (VIAL / BOTTLE / SACHET) ── -->
  <!-- Sterile Injection Vial Presentation -->
  <g transform="translate(195, 115) rotate(-5)" filter="url(#softShadow)">
    <!-- Ampoule Tip -->
    <path d="M15 0 C15 0 17 6 17 14 C17 20 19 24 20 26 L20 30 L10 30 L10 26 C11 24 13 20 13 14 C13 6 15 0 15 0 Z" fill="#E8F4EE" stroke="#1B634E" stroke-width="1.2"/>
    <!-- Ampoule Body -->
    <rect x="8" y="30" width="14" height="60" rx="3" fill="url(#vialGlass)" stroke="#1B634E" stroke-width="1.2"/>
    <path d="M9 48 L21 48 L21 88 C21 89 20 89 19 89 L11 89 C10 89 9 89 9 88 Z" fill="url(#liquidGrad)"/>
    <text x="15" y="68" font-family="'Inter', sans-serif" font-size="4" font-weight="700" fill="#1B634E" text-anchor="middle" transform="rotate(-90 15 68)">10ml WFI</text>
  </g>
  <g transform="translate(225, 80)" filter="url(#softShadow)">
    <!-- Flip-off Crimp Cap -->
    <rect x="22" y="6" width="34" height="12" rx="3" fill="#0A7D58"/>
    <rect x="18" y="18" width="42" height="7" rx="2" fill="#DCE8E0" stroke="#9bb7a8" stroke-width="1"/>
    <!-- Neck -->
    <rect x="25" y="25" width="28" height="12" fill="url(#vialGlass)" stroke="#9bb7a8" stroke-width="1.2"/>
    <!-- Shoulder & Body -->
    <path d="M25 37 C16 40 8 48 8 62 L8 150 C8 160 16 168 26 168 L52 168 C62 168 70 160 70 150 L70 62 C70 48 62 40 53 37 Z" fill="url(#vialGlass)" stroke="#1B634E" stroke-width="1.8"/>
    <!-- Vial Contents -->
    <path d="M10 88 L68 88 L68 150 C68 158 61 166 52 166 L26 166 C17 166 10 158 10 150 Z" fill="url(#liquidGrad)"/>
    <!-- Glass Reflections -->
    <line x1="13" y1="45" x2="13" y2="158" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <line x1="65" y1="48" x2="65" y2="158" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
    <!-- Pharmaceutical Vial Label -->
    <rect x="10" y="92" width="58" height="48" fill="#FFFFFF" fill-opacity="0.96" stroke="#DCE8E0" stroke-width="1"/>
    <rect x="12" y="95" width="54" height="3" fill="#0A7D58"/>
    <text x="39" y="106" font-family="'Fraunces', serif" font-size="7.5" font-weight="bold" fill="#1B634E" text-anchor="middle">MEROZIL 500mg</text>
    <text x="39" y="114" font-family="'Inter', sans-serif" font-size="5" font-weight="600" fill="#0A7D58" text-anchor="middle">500 mg</text>
    <text x="39" y="122" font-family="'Inter', sans-serif" font-size="4.5" fill="#3E6958" text-anchor="middle">STERILE INJECTION</text>
    <text x="39" y="130" font-family="'Inter', sans-serif" font-size="4.5" font-weight="bold" fill="#0D9E71" text-anchor="middle">FOR IV / IM USE</text>
  </g>

  <!-- Quality Stamp Seal -->
  <g transform="translate(325, 25)" filter="url(#softShadow)">
    <circle cx="18" cy="18" r="18" fill="#FFFFFF" stroke="#DCE8E0" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="15" fill="#DCEEE4"/>
    <path d="M18 9 L25 12 V18 C25 22 22 25 18 27 C14 25 11 22 11 18 V12 L18 9 Z" fill="#0A7D58"/>
    <path d="M15 18 L17.5 20.5 L21.5 15.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="5" font-weight="700" fill="#1B634E" text-anchor="middle">ASSURED</text>
  </g>
</svg>