<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#E8F4EE"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#d6ece0"/>
      <stop offset="100%" stop-color="#bfe4d1"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087B59"/>
      <stop offset="50%" stop-color="#173B30"/>
      <stop offset="100%" stop-color="#087B59"/>
    </linearGradient>
    <filter id="sachetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173B30" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Platform Shadow -->
  <ellipse cx="160" cy="245" rx="85" ry="12" fill="#087B59" fill-opacity="0.1"/>

  <!-- Secondary Background Sachet (Paired) -->
  <g transform="translate(135, 45) rotate(10)" filter="url(#sachetShadow)" opacity="0.6">
    <rect x="0" y="0" width="95" height="155" rx="8" fill="#E8F4EE" stroke="#9bb7a8" stroke-width="1.5"/>
    <rect x="0" y="0" width="95" height="15" rx="4" fill="#087B59" fill-opacity="0.4"/>
    <rect x="0" y="140" width="95" height="15" rx="4" fill="#087B59" fill-opacity="0.4"/>
  </g>

  <!-- Primary Front Sachet -->
  <g transform="translate(90, 38)" filter="url(#sachetShadow)">
    <!-- Foil Sachet Main Body -->
    <rect x="0" y="0" width="115" height="175" rx="10" fill="url(#foilGrad)" stroke="#087B59" stroke-width="2"/>

    <!-- Crimped Heat-Seal Top Border -->
    <rect x="2" y="2" width="111" height="18" rx="6" fill="url(#sealGrad)"/>
    <g stroke="#ffffff" stroke-width="1" opacity="0.3">
      <line x1="10" y1="4" x2="10" y2="18"/>
      <line x1="20" y1="4" x2="20" y2="18"/>
      <line x1="30" y1="4" x2="30" y2="18"/>
      <line x1="40" y1="4" x2="40" y2="18"/>
      <line x1="50" y1="4" x2="50" y2="18"/>
      <line x1="60" y1="4" x2="60" y2="18"/>
      <line x1="70" y1="4" x2="70" y2="18"/>
      <line x1="80" y1="4" x2="80" y2="18"/>
      <line x1="90" y1="4" x2="90" y2="18"/>
      <line x1="100" y1="4" x2="100" y2="18"/>
    </g>

    <!-- Tear Notch -->
    <path d="M0 24 L6 27 L0 30 Z" fill="#173B30"/>
    <path d="M115 24 L109 27 L115 30 Z" fill="#173B30"/>

    <!-- Crimped Heat-Seal Bottom Border -->
    <rect x="2" y="155" width="111" height="18" rx="6" fill="url(#sealGrad)"/>
    <g stroke="#ffffff" stroke-width="1" opacity="0.3">
      <line x1="10" y1="157" x2="10" y2="171"/>
      <line x1="25" y1="157" x2="25" y2="171"/>
      <line x1="40" y1="157" x2="40" y2="171"/>
      <line x1="55" y1="157" x2="55" y2="171"/>
      <line x1="70" y1="157" x2="70" y2="171"/>
      <line x1="85" y1="157" x2="85" y2="171"/>
      <line x1="100" y1="157" x2="100" y2="171"/>
    </g>

    <!-- Center Label Area -->
    <rect x="12" y="32" width="91" height="114" rx="6" fill="#ffffff" stroke="#DCE8E0" stroke-width="1"/>
    
    <!-- Brand / Product Header Banner -->
    <rect x="16" y="38" width="83" height="6" rx="2" fill="#087B59"/>
    <line x1="18" y1="54" x2="72" y2="54" stroke="#173B30" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="64" x2="85" y2="64" stroke="#087B59" stroke-width="1.75" stroke-linecap="round"/>
    
    <!-- Active Composition Lines -->
    <line x1="18" y1="74" x2="68" y2="74" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="82" x2="58" y2="82" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Molecule / Nutrition Symbol -->
    <g transform="translate(42, 92)">
      <circle cx="15" cy="15" r="14" fill="#E8F4EE" stroke="#087B59" stroke-width="1.5"/>
      <path d="M15 8 L15 22 M8 15 L22 15" stroke="#087B59" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="15" cy="8" r="2.5" fill="#087B59"/>
      <circle cx="15" cy="22" r="2.5" fill="#087B59"/>
      <circle cx="8" cy="15" r="2.5" fill="#087B59"/>
      <circle cx="22" cy="15" r="2.5" fill="#087B59"/>
    </g>

    <!-- Dose / Net Weight Badge -->
    <rect x="18" y="130" width="77" height="10" rx="3" fill="#E8F4EE"/>
    <text x="56" y="137" font-family="sans-serif" font-size="6" font-weight="700" fill="#087B59" text-anchor="middle">THERAPEUTIC SACHET</text>

    <!-- Specular Light Reflection Streak -->
    <line x1="8" y1="15" x2="8" y2="160" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Supplement Quality Seal -->
  <g transform="translate(200, 165)">
    <circle cx="22" cy="22" r="22" fill="#ffffff" stroke="#DCE8E0" stroke-width="2" filter="url(#sachetShadow)"/>
    <circle cx="22" cy="22" r="18" fill="#E8F4EE"/>
    <!-- Medical Cross -->
    <path d="M22 13 V31 M13 22 H31" stroke="#087B59" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
